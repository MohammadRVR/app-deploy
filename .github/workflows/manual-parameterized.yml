name: Parameterized Manual Workflow

on:
  workflow_dispatch:
    inputs:
      application_name:
        description: "Application Name"
        required: true
        type: string
      run_validation:
        description: "Run Validation"
        type: boolean
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      validation_status: ${{ steps.set-status.outputs.validation_status }}
    steps:
      - name: Print inputs
        run: |
          echo "Application Name: ${{ github.event.inputs.application_name }}"
          echo "Run Validation: ${{ github.event.inputs.run_validation }}"

      - name: Determine Validation result
        id: set-status
        run: |
          if [ "${{ github.event.inputs.run_validation }}" = "true" ]; then
            echo "validation_status=success" >> $GITHUB_OUTPUT
          else
            echo "validation_status=skipped" >> $GITHUB_OUTPUT
          fi

  summary:
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.validation_status == 'success'
    steps:
      - name: Print execution summary
        run: |
          echo "Validation succeeded for application: ${{ github.event.inputs.application_name }}"
          echo "Final execution summary complete."
        
